<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f2f2f2;

    }

    .container {
        width: 95%;

        margin: 20px auto;
        border: 2px solid gray;
        background: white;
    }

    /* Header */

    header {
        height: 180px;
        background: url("images/header.jpg");
        background-size: cover;
        position: relative;
    }

    .logo {
        width: 70px;
        height: 90px;
        position: absolute;
    }

    .logo1 {
        top: 15px;
        left: 20px;
    }

    .logo2 {
        top: 80px;
        left: 45px;
    }

    /* Navigation */

    nav {
        background: #9c9c9c;
    }

    nav ul {
        list-style: none;
        display: flex;
    }

    nav ul li {
        flex: 1;
        text-align: center;
    }

    nav ul li a {
        display: block;
        text-decoration: none;
        color: black;
        padding: 12px;
    }

    .active {
        background: red;
    }

    nav ul li:hover {
        background: #89e2b4;
    }

    /* Gallery */

    .gallery {
        background: rgb(165, 201, 203);
        height: 250px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    table {
        border-collapse: collapse;
        width: 220px;
        overflow: hidden;
        border-radius: 15px;
    }

    th {
        background: green;
        color: white;
        padding: 10px;
    }

    td {
        padding: 10px;
        background: #adff2f;
        text-align: center;
    }

    tr:nth-child(even) td {
        background: green;
        color: white;
    }

    td img {
        width: 30px;
        height: 30px;
    }

    /* Login */

    .login-section {
        background: url("images/background.jpg");
        background-size: cover;
        padding: 40px;
    }

    .form-box {
        display: flex;
        justify-content: center;
        gap: 50px;
    }

    .login,
    .signup {
        background: rgb(227, 208, 208);
        width: 300px;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
    }

    .login h2,
    .signup h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        background: #e8e8e8;
        border: none;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #0066ff;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #004ec2;
    }

    /* Footer */

    footer {
        background: #f7d9ac;
        padding: 20px;
    }

    footer h3 {
        font-style: italic;
        margin-bottom: 10px;
    }

    footer p {
        font-size: 18px;
        font-style: italic;
    }
</style>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <img src="bmw.webp" class="logo logo1">
            <img src="ford.avif" class="logo logo2">
            <img src="bg image.avif" style="height: 180px;" width="100%" alt="">
        </header>

        <!-- Navigation -->
        <nav>
            <ul>
                <li class="active"><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Myself</a></li>
                <li><a href="#">Others</a></li>
            </ul>
        </nav>

        <!-- Gallery -->
        <section class="gallery">

            <table>
                <tr>
                    <th colspan="2">Cars</th>
                </tr>

                <tr>
                    <td>BMW</td>
                    <td><img src="bmw.webp"></td>
                </tr>

                <tr>
                    <td>AUDI</td>
                    <td><img src="audi.jpg"></td>
                </tr>

                <tr>
                    <td>BENZ</td>
                    <td><img src="benz.jpg"></td>
                </tr>

                <tr>
                    <td>MUSTANG</td>
                    <td><img src="ford.avif"></td>
                </tr>

            </table>

        </section>

        <!-- Login Area -->
        <section class="login-section">

            <div class="form-box">

                <div class="login">
                    <h2>Sign In</h2>

                    <input type="text" placeholder="Username">

                    <input type="password" placeholder="Password">

                    <button>Sign In</button>

                </div>

                <div class="signup">

                    <h2>Sign Up</h2>

                    <input type="text" placeholder="Name">

                    <input type="email" placeholder="Email">

                    <input type="password" placeholder="Password">

                    <button>Sign Up</button>

                </div>

            </div>

        </section>

        <!-- Footer -->
        <footer>

            <h3>Your address</h3>

            <p>
                © 2026-2027. (URK24CS1144) - Web Technology Lab Batch 1.
                All Rights Reserved.
            </p>

        </footer>

    </div>

</body>

</html>
