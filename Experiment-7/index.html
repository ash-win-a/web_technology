<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Experiment 7</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 80%;
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #002f5e;
            margin-bottom: 10px;
        }

        h2 {
            color: #444;
            margin-bottom: 30px;
        }

        .question {
            display: block;
            background: #002f5e;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.3s;
        }

        .question:hover {
            background: #4facfe;
            transform: scale(1.03);
        }

        footer {
            margin-top: 25px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Experiment 7</h1>

        <h2>Select a Question</h2>

        <a href="a.html" class="question">
            Question A
        </a>

        <a href="b.html" class="question">
            Question B
        </a>

        <a href="c.html" class="question">
            Question C
        </a>

        <footer>
            Web Technology Experiment 7
        </footer>

    </div>

</body>

</html>
