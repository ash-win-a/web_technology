<!DOCTYPE html>
<html>

<head>
    <title>Shortest and Longest Word</title>
</head>

<body>

    <h2 style="color: rgb(10, 231, 10);"> Shortest and Longest Word</h2>

    <script>
        function findWords(str) {
            var words = str.split(" ");
            var shortest = words[0];
            var longest = words[0];

            for (var i = 1; i < words.length; i++) {
                if (words[i].length < shortest.length) {
                    shortest = words[i];
                }

                if (words[i].length > longest.length) {
                    longest = words[i];
                }
            }

            document.write("Shortest: " + shortest + "<br>");
            document.write("Longest: " + longest);
        }

        findWords("Web Development Tutorial");
    </script>

</body>

</html>
